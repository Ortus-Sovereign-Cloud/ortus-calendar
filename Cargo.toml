[package]
name = "ortus-calendar"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Calendar and contacts: CalDAV, CardDAV, invitations, free and busy, the directory."
repository = "https://github.com/Ortus-Sovereign-Cloud/ortus-calendar"
publish = false

[dependencies]
calcard = { package = "calcard-next", version = "3.0", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
quick-xml = "0.42"
rust-embed = "8.14.0"
rust-web-server = "18.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
# Built from the commit in pins.toml (checked out by ci/fetch.sh), never
# from the branch: see the patch below.
ortus-core = { git = "https://github.com/Ortus-Sovereign-Cloud/ortus-core" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[patch."https://github.com/Ortus-Sovereign-Cloud/ortus-core"]
ortus-core = { path = ".deps/ortus-core" }

# Small debug builds: line numbers for our own code, no debug info for
# dependencies (a full debug build of the tests took 25 GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
